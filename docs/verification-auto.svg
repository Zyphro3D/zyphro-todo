<text x="614" y="80" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f1f1f2" text-anchor="start">✓  Tâche cochée</text>
<text x="614" y="98" font-family="ui-monospace, 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#9c9ca3" text-anchor="start">rien d'autre à faire</text>
<rect x="600" y="150" width="240" height="72" rx="6" fill="#1c1c1f" stroke="#3a3a40" stroke-width="1"/>
<text x="614" y="170" font-family="ui-monospace, 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="9" font-weight="500" fill="#d4b06a" text-anchor="start" letter-spacing="0.08em">ATTENTE</text>
<text x="614" y="190" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f1f1f2" text-anchor="start">⏱  Pas encore</text>
<text x="614" y="208" font-family="ui-monospace, 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#9c9ca3" text-anchor="start">attend son prochain essai</text>
<rect x="600" y="262" width="240" height="92" rx="6" fill="#1c1c1f" stroke="#e8434d" stroke-width="1.4"/>
<text x="614" y="282" font-family="ui-monospace, 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="9" font-weight="500" fill="#d4b06a" text-anchor="start" letter-spacing="0.08em">ÉCHEC</text>
<text x="614" y="302" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f1f1f2" text-anchor="start">✗  Échec</text>
<text x="614" y="320" font-family="ui-monospace, 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#9c9ca3" text-anchor="start">priorité haute</text>
<text x="614" y="335" font-family="ui-monospace, 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#9c9ca3" text-anchor="start">sortie visible au survol</text>
