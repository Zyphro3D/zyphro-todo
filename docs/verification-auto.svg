<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" role="img" aria-labelledby="t d">
<title id="t">Cycle d'une vérification automatique</title>
<desc id="d">À l'échéance, la commande tourne sur le serveur : code 0 coche la tâche, code 75 la remet à 30 minutes et échoue après 12 heures, tout autre code la passe en échec avec priorité haute.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c9ca3"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e8434d"/></marker>
<pattern id="weave" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#0b0b0c"/><rect width="3" height="6" fill="#0e0e10"/></pattern>
</defs>
<rect width="920" height="440" rx="12" fill="url(#weave)"/>
