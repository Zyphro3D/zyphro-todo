<text x="314" y="223" font-family="ui-monospace, 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#9c9ca3" text-anchor="start">5 min au plus</text>
<rect x="600" y="40" width="240" height="80" rx="6" fill="#1c1c1f" stroke="#3a3a40" stroke-width="1"/>
