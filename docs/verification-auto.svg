<text x="566" y="74" font-family="ui-monospace, 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="8.5" font-weight="500" fill="#9c9ca3" text-anchor="middle" letter-spacing="0.06em">CODE 0</text>
