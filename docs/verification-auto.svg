<text x="54" y="190" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f1f1f2" text-anchor="start">Échéance</text>
<text x="54" y="208" font-family="ui-monospace, 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#9c9ca3" text-anchor="start">09:00 sans heure</text>
