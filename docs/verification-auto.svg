<rect x="713.0" y="236" width="66.0" height="14" rx="3" fill="#0b0b0c"/>
<text x="746" y="246" font-family="ui-monospace, 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="8.5" font-weight="500" fill="#9c9ca3" text-anchor="middle" letter-spacing="0.06em">APRÈS 12 H</text>
